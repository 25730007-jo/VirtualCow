<script>

let state;
let currentScene;
let typingInterval;

function startGame(){

    document.querySelector("header").style.display = "flex";
    document.querySelector("main").style.display = "flex";

    document.getElementById("title-screen").style.display = "none";

    initGame();
}

function goTitle(){

    document.querySelector("header").style.display = "none";
    document.querySelector("main").style.display = "none";

    document.getElementById("title-screen").style.display = "flex";

    clearInterval(typingInterval);
}

/* 초기화 */
function initGame(){

    state = {
        energy:50,
        focus:50,
        sync:10
    };

    currentScene = "S1";

    document.body.className = "";

    document.getElementById("stats").style.display="none";

    render();
}

/* 범위 제한 */
function clamp(v){
    return Math.max(0, Math.min(100, v));
}

/* 상태 색상 */
function getColor(type, v){

    if(type==="sync"){

        if(v <= 20) return "lime";
        if(v >= 60) return "red";

        return "white";
    }

    else{

        if(v >= 80) return "lime";
        if(v <= 30) return "red";

        return "white";
    }
}

/* UI 업데이트 */
function updateUI(){

    state.energy = clamp(state.energy);
    state.focus = clamp(state.focus);
    state.sync = clamp(state.sync);

    document.getElementById("energy").innerHTML =
        `<span style="color:${getColor('energy',state.energy)}">Energy: ${state.energy}</span>`;

    document.getElementById("sync").innerHTML =
        `&nbsp;&nbsp;&nbsp;&nbsp;<span style="color:${getColor('sync',state.sync)}">Sync: ${state.sync}</span>`;

    document.getElementById("focus").innerHTML =
        `&nbsp;&nbsp;&nbsp;&nbsp;<span style="color:${getColor('focus',state.focus)}">Focus: ${state.focus}</span>`;
}

/* 타이핑 효과 + 자동 스크롤 */
function typeText(el, text, speed=14){

    clearInterval(typingInterval);

    el.innerHTML = "";

    let i = 0;

    const wrapper = document.getElementById("content-wrapper");

    typingInterval = setInterval(()=>{

        el.innerHTML += text[i];

        /* 자동으로 최신 출력 위치 따라가기 */
        wrapper.scrollTop = wrapper.scrollHeight;

        i++;

        if(i >= text.length){

            clearInterval(typingInterval);

            wrapper.scrollTop = wrapper.scrollHeight;
        }

    }, speed);
}

/* 이미지 설정 */
function setImage(){

    let img = document.getElementById("scene-img");

    img.src = `images/${currentScene}_img.png`;

    img.onerror = function(){
        img.src = "images/default_scene.png";
    }
}
/* 엔딩 테마 */
function applyEndingTheme(scene){

    if(scene==="S10B"){
        document.body.className = "bad";
    }

    else if(scene==="S10NV" || scene==="S10NR"){
        document.body.className = "normal";
    }

    else if(scene==="S10H"){
        document.body.className = "happy";
    }

    else{
        document.body.className = "";
    }
}

function go(scene){

    currentScene = scene;

    render();
}
